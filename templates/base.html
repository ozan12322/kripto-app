<!doctype html>
<html lang="id" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulasi Kriptografi Klasik</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
    <style>
      .fade-in {
        animation: fadeIn 0.6s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"
          >🔐 Simulasi Kriptografi Klasik</a
        >
        <button class="btn btn-outline-light btn-sm" id="themeToggle">
          🌓 Mode
        </button>
      </div>
    </nav>

    <div class="container mb-5">{% block content %}{% endblock %}</div>

    <footer
      class="footer mt-auto py-4 bg-dark text-light-50 border-top border-secondary"
    >
      <div class="container text-center">
        <p class="mb-1 text-white fw-semibold">
          🔐 Aplikasi Simulasi Kriptografi
        </p>
        <p class="mb-2 text-muted small" style="letter-spacing: 0.5px">
          &copy; 2026 - Rizqi Fauzan. Dibuat secara mandiri untuk memenuhi Tugas
          Besar Mata Kuliah Kriptografi.
        </p>
        <div class="d-flex justify-content-center gap-3 mt-2">
          <span class="badge bg-secondary font-monospace">Python 3</span>
          <span class="badge bg-secondary font-monospace">Flask Framework</span>
          <span class="badge bg-secondary font-monospace">Bootstrap 5</span>
          <span class="badge bg-success font-monospace"
            >Lisensi: Edukasi / Fair Use</span
          >
        </div>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <script>
      const themeToggle = document.getElementById("themeToggle");
      themeToggle.addEventListener("click", () => {
        const currentTheme =
          document.documentElement.getAttribute("data-bs-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-bs-theme", newTheme);
      });
    </script>
  </body>
</html>
